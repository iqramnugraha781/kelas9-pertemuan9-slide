// ===== KODE =====
(function(){
const $=s=>document.querySelector(s),S=MATERI.slides,N=S.length;
const E=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cur=0,fs=16,sec=0,tint=null,tabi=0,sp=0,lastQ=-1,pool=[],picked=[],qs=[],QS,TS;
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2600)};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function clip(t){const fb=()=>{try{const x=document.createElement('textarea');x.value=t;x.style.cssText='position:fixed;opacity:0';document.body.appendChild(x);x.select();const ok=document.execCommand('copy');x.remove();toast(ok?'Tersalin ✓':'Salin manual: blok teks lalu Ctrl+C')}catch(e){toast('Salin manual: blok teks lalu Ctrl+C')}};
 if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(()=>toast('Tersalin ✓'),fb);else fb()}
const mm=s=>String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function cards(it){return `<div class="bar"><button data-act="a1">Buka semua</button><button data-act="a0">Tutup semua</button></div><div class="grid">`+it.map(x=>`<button class="card" aria-expanded="false"><b>${E(x.q)}</b><i>Ketuk untuk membuka jawaban</i><span class="a">${E(x.a)}</span></button>`).join('')+`</div>`}
function initQuiz(){QS={i:0,votes:[],open:false,res:[],done:false};qs=MATERI.kuis.map(q=>({q:q.q,p:q.p,o:shuffle(q.o.map((t,k)=>({t,ok:k===0})))}))}
function initTicket(){TS=0}
function quiz(){const k=QS;
 if(k.done){return `<h2>Rekap cek ombak</h2>`+k.res.map((r,i)=>`<div class="feed"><b>Soal ${i+1}:</b> ${r==null?'tidak ada data suara':Math.round(r)+'% benar'+(r<50?' — ⚠️ perlu dibahas ulang':' ✓')}</div>`).join('')+`<div class="bar"><button data-act="qr">Ulangi kuis</button></div>`}
 const q=qs[k.i],v=k.votes[k.i]||(k.votes[k.i]=q.o.map(()=>0)),tot=v.reduce((a,b)=>a+b,0);
 return `<p class="pill">Soal ${k.i+1} dari ${qs.length}</p><p class="big">${E(q.q)}</p>`+q.o.map((o,j)=>`<div class="opt ${k.open?(o.ok?'ok':'no'):''}"><span>${'ABCD'[j]}. ${E(o.t)} ${k.open&&o.ok?'✅ benar':''}</span><span class="v"><button data-act="vm" data-j="${j}" ${k.open?'disabled':''} aria-label="kurangi">−</button><b>${v[j]}</b><button data-act="vp" data-j="${j}" ${k.open?'disabled':''} aria-label="tambah">+</button></span><span class="bg"><i style="width:${tot?v[j]/tot*100:0}%"></i></span></div>`).join('')+
 (k.open?`<div class="feed">💡 ${E(q.p)}<br>${tot?Math.round(k.res[k.i])+'% kelas menjawab benar.':'Tidak ada data suara.'}</div><div class="bar"><button data-act="qn">${k.i<qs.length-1?'Soal berikutnya ▶':'Lihat rekap'}</button></div>`:`<div class="bar"><button data-act="qo">Buka jawaban</button></div>`)}
function ticket(){const t=MATERI.tiket;return `<p class="lead">Rangkuman: TTIJA, lima jenis konten, konsumen dan produsen.</p><p class="pill">Tiket keluar ${Math.min(TS+1,t.length)} dari ${t.length}</p><p class="big">${TS<t.length?E(t[TS]):'Selesai. Terima kasih! 🎉'}</p><div class="bar">${TS<t.length?'<button data-act="tn">Pertanyaan berikutnya ▶</button>':''}<button data-act="tr2">Ulangi</button></div>`}
function render(){const s=S[cur],x=s.isi;let h=`<h2>${cur+1}. ${E(s.judul)}</h2><p><span class="pill">${s.menit} menit</span></p>`;
 if(s.tipe==='cards')h+=`<p class="lead">${E(x.intro)}</p>`+cards(x.items);
 else if(s.tipe==='tabs'){const t=x.tabs[tabi];h+=`<div class="tabs">${x.tabs.map((a,i)=>`<button class="${i===tabi?'on':''}" data-act="tab" data-i="${i}">${E(a.n)}</button>`).join('')}</div><p class="lead">${E(t.intro)}</p>`+cards(t.items)}
 else if(s.tipe==='info')h+=x.html;else if(s.tipe==='quiz')h+=quiz();else h+=ticket();
 $('#stage').innerHTML=h;
 $('#pg').textContent=`Slide ${cur+1} / ${N}`;$('#prog i').style.width=((cur+1)/N*100)+'%';panels()}
function panels(){const s=S[cur],g=s.guru;
 const li=a=>a&&a.length?'<ul>'+a.map(t=>`<li>${E(t)}</li>`).join('')+'</ul>':'';
 $('#pg-guru').innerHTML=`<h3>📋 ${E(s.judul)}</h3><p>⏱ ${s.menit} menit · total ${S.reduce((a,b)=>a+b.menit,0)} menit</p>${g.cek?'<p class="warn">⚠️ Isi dikembangkan Claude, perlu diperiksa guru.</p>':''}<b>Yang dilakukan guru</b>${li(g.langkah)}${g.pemantik.length?'<b>Pertanyaan pemantik</b>'+li(g.pemantik):''}${g.miskonsepsi?'<b>Waspadai miskonsepsi</b><p>'+E(g.miskonsepsi)+'</p>':''}${g.luarMedia?'<b>Kegiatan di luar media</b><p>'+E(g.luarMedia)+'</p>':''}`;
 const n=s.siswa;
 $('#pg-siswa').innerHTML=n?`<h3>✏️ ${E(n.judul)}</h3><ul>${n.poin.slice(0,sp).map(t=>`<li>${E(t)}</li>`).join('')}</ul><p>${sp} dari ${n.poin.length} poin</p><div class="bar"><button data-act="sn">Munculkan poin berikutnya</button><button data-act="sa">Tampilkan semua</button><button data-act="sc">Salin catatan</button></div>`:`<h3>✏️ Catatan Siswa</h3><p>Slide ini murni aktivitas, tanpa catatan.</p>`}
function go(n){n=Math.max(0,Math.min(N-1,n));if(n!==cur){cur=n;tabi=0;sp=0;if(S[cur].tipe==='quiz')initQuiz();if(S[cur].tipe==='ticket')initTicket();try{localStorage.setItem('m9pos',cur)}catch(e){}}render();$('#menu').style.display='none'}
function tog(id){const p=$(id),on=p.style.display==='block';p.style.display=on?'none':'block'}
function closeAll(){document.querySelectorAll('.panel,.modal,#menu,#blk').forEach(e=>e.style.display='none')}
function allNotes(){return MATERI.judul+'\nCatatan Siswa\n\n'+S.filter(s=>s.siswa).map((s,i)=>s.siswa.judul+'\n'+s.siswa.poin.map(p=>'- '+p).join('\n')).join('\n\n')}
function openK(){const t=allNotes();$('#kt').value=t;try{$('#kd').href=URL.createObjectURL(new Blob([t],{type:'text/plain'}))}catch(e){toast('Unduhan diblokir, gunakan Salin')}$('#m-k').style.display='flex'}
function newQ(){const q=S[cur].guru.pemantik;if(!q.length){$('#qt').textContent='Slide ini tidak punya pertanyaan pemantik.';return}let i;do{i=Math.random()*q.length|0}while(q.length>1&&i===lastQ);lastQ=i;$('#qt').textContent=q[i]}
function names(){return $('#nm').value.split('\n').map(t=>t.trim()).filter(Boolean)}
function cnt(){$('#pc').textContent=picked.length+' dari '+names().length+' sudah terpilih'}
function pick(){const a=names();if(!a.length){toast('Isi daftar nama dulu');return}try{localStorage.setItem('m9names',$('#nm').value)}catch(e){}
 picked=picked.filter(n=>a.includes(n));if(picked.length>=a.length){picked=[];toast('Semua sudah terpilih, putaran baru dimulai')}
 const left=a.filter(n=>!picked.includes(n)),res=left[Math.random()*left.length|0],t0=Date.now(),r=$('#pr');
 const iv=setInterval(()=>{r.textContent=a[Math.random()*a.length|0];if(Date.now()-t0>800){clearInterval(iv);r.textContent='🎉 '+res;picked.push(res);cnt()}},70)}
function setFs(d){fs=Math.max(13,Math.min(22,fs+d));document.documentElement.style.fontSize=fs+'px'}
function tim(){if(tint){clearInterval(tint);tint=null}else tint=setInterval(()=>{sec++;$('#tm').textContent='⏱ '+mm(sec)},1000)}
function act(e){const b=e.target.closest('button');if(!b)return;
 if(b.classList.contains('card')){const o=b.classList.toggle('open');b.setAttribute('aria-expanded',o);return}
 const a=b.dataset.act;if(!a)return;const k=QS;
 if(a==='a1'||a==='a0')document.querySelectorAll('.card').forEach(c=>{c.classList.toggle('open',a==='a1');c.setAttribute('aria-expanded',a==='a1')});
 else if(a==='tab'){tabi=+b.dataset.i;render()}
 else if(a==='kum')openK();
 else if(a==='vp'||a==='vm'){const v=k.votes[k.i],j=+b.dataset.j;v[j]=Math.max(0,v[j]+(a==='vp'?1:-1));render()}
 else if(a==='qo'){const v=k.votes[k.i],tot=v.reduce((x,y)=>x+y,0),ok=qs[k.i].o.findIndex(o=>o.ok);k.open=true;k.res[k.i]=tot?v[ok]/tot*100:null;if(tot&&k.res[k.i]>=50&&window.confetti){try{confetti({particleCount:120,spread:70,origin:{y:.7}})}catch(x){}}render()}
 else if(a==='qn'){k.open=false;if(k.i<qs.length-1)k.i++;else k.done=true;render()}
 else if(a==='qr'){initQuiz();render()}
 else if(a==='tn'){TS++;render()}else if(a==='tr2'){TS=0;render()}
 else if(a==='sn'){sp=Math.min(S[cur].siswa.poin.length,sp+1);panels()}
 else if(a==='sa'){sp=S[cur].siswa.poin.length;panels()}
 else if(a==='sc'){const n=S[cur].siswa;clip(n.judul+'\n'+n.poin.map(p=>'- '+p).join('\n'))}}
$('#stage').addEventListener('click',act);$('#pg-siswa').addEventListener('click',act);
$('#jd').textContent=MATERI.judul;$('#tp').textContent=MATERI.topik;
$('#bp').onclick=()=>go(cur-1);$('#bn').onclick=()=>go(cur+1);
$('#pg').onclick=()=>{const m=$('#menu');m.innerHTML=S.map((s,i)=>`<button data-i="${i}"><span>${i+1}. ${E(s.judul)}</span><span>${s.menit}′</span></button>`).join('');m.style.display=m.style.display==='block'?'none':'block'};
$('#menu').onclick=e=>{const b=e.target.closest('button');if(b)go(+b.dataset.i)};
$('#tm').onclick=tim;$('#tr').onclick=()=>{clearInterval(tint);tint=null;sec=0;$('#tm').textContent='⏱ 00:00'};
$('#b-n').onclick=()=>tog('#pg-guru');$('#b-s').onclick=()=>tog('#pg-siswa');
$('#b-q').onclick=()=>{newQ();cnt();$('#m-q').style.display='flex'};
$('#qg').onclick=newQ;$('#pk').onclick=pick;$('#rs').onclick=()=>{picked=[];$('#pr').textContent='—';cnt();toast('Putaran direset')};
$('#fm').onclick=()=>setFs(-1);$('#fp').onclick=()=>setFs(1);
function full(){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>toast('Layar penuh tidak tersedia'))}catch(e){toast('Layar penuh tidak tersedia')}}
$('#b-f').onclick=full;$('#kc').onclick=()=>clip($('#kt').value);
document.querySelectorAll('.cl').forEach(b=>b.onclick=closeAll);
document.addEventListener('keydown',e=>{const t=e.target.tagName;if(/INPUT|TEXTAREA|SELECT/.test(t)||e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key;
 if(k==='ArrowRight'||k==='PageDown')go(cur+1);else if(k==='ArrowLeft'||k==='PageUp')go(cur-1);
 else if(k==='Home')go(0);else if(k==='End')go(N-1);
 else if(k==='n'||k==='N')tog('#pg-guru');else if(k==='s'||k==='S')tog('#pg-siswa');
 else if(k==='q'||k==='Q')$('#b-q').click();else if(k==='f'||k==='F')full();
 else if(k==='b'||k==='B'){const x=$('#blk');x.style.display=x.style.display==='block'?'none':'block'}
 else if(k==='Escape')closeAll();
 else if(k==='Enter'&&$('#pg-siswa').style.display==='block'&&S[cur].siswa){e.preventDefault();sp=Math.min(S[cur].siswa.poin.length,sp+1);panels()}});
try{$('#nm').value=localStorage.getItem('m9names')||'';const p=+localStorage.getItem('m9pos');if(p>0&&p<N)cur=p}catch(e){}
if(S[cur].tipe==='quiz')initQuiz();else initQuiz();
initTicket();render();
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.6.0/confetti.browser.min.js"></script>
</body></html>
